[workspace]
resolver = "2"
members = ["cli", "core", "gui", "server", "shared", "srv-lib"]

[workspace.dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.33"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }
vial-core = { path = "core", version = "0.4.0" }
vial-shared = { path = "shared", version = "0.4.0" }
vial-srv = { path = "srv-lib", version = "0.4.0" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
