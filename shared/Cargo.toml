[package]
name = "vial-shared"
version = "0.4.0"
edition = "2024"
description = """
Shared request / response types for Vial
"""
readme = "../README.md"
homepage = "https://github.com/TheRustyPickle/Vial"
repository = "https://github.com/TheRustyPickle/Vial"
license = "MIT"
keywords = ["cli", "e2ee", "secret", "secure", "vault"]
categories = ["command-line-utilities"]

[dependencies]
chrono.workspace = true
postcard = { version = "1.1.3", features = ["use-std"] }
serde.workspace = true
serde_json.workspace = true
serde_with = { version = "3.21.0", features = ["base64"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = { workspace = true, optional = true }
dirs = { version = "6.0.0", optional = true }

[features]
default = []
config = ["dep:anyhow", "dep:dirs"]
