[package]
name = "vial-srv"
version = "0.4.0"
edition = "2024"
description = """
Framework-agnostic server logic for Vial
"""
readme = "README.md"
homepage = "https://github.com/TheRustyPickle/Vial"
repository = "https://github.com/TheRustyPickle/Vial"
license = "MIT"
keywords = ["cli", "e2ee", "secret", "secure", "vault"]
categories = ["command-line-utilities"]

[dependencies]
chrono.workspace = true
diesel = { version = "2.3.11", features = ["chrono"] }
diesel-async = { version = "0.9.2", features = [
  "bb8",
  "migrations",
  "postgres",
] }
diesel_migrations = "2.3.2"
futures-util = "0.3.32"
log.workspace = true
rustls = { version = "0.23.42", features = ["ring"] }
thiserror = "2.0.18"
tokio.workspace = true
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
ulid = "3.0.0"
vial-shared = { workspace = true, features = ["config"] }
